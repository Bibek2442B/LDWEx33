{% extends "base.html" %}
{% block title %}Admin - Confirm Delete Product{% endblock %}
{% block content %}
    <h1>Confirm Delete Product</h1>
    <p>Are you sure you want to delete the product "{{ product.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'shop:products:admin_products' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
