{% extends "base.html" %}
{% load django_bootstrap5 %}
{% block title %}Admin - Product List{% endblock %}
{% block content %}
    <h1>Add New Product</h1>
    <form method="post">
        {% csrf_token %}
        <!-- {{ form.as_p }} -->
          {% bootstrap_form form %}
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
    <a href="{% url 'shop:products:admin_products' %}">Back to Product List</a>
{% endblock %}
