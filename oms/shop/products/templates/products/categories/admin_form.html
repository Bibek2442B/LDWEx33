{% extends "base.html" %}
{% block title %}Admin - Add Category{% endblock %}
{% block content %}
    <h1>Add New Category</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
    <a href="{% url 'shop:products:admin_categories' %}">Back to Category List</a>
{% endblock %}
