{%extends "base.html" %}
{% block title %}Admin - Confirm Delete Category{% endblock %}
{% block content %}
    <h1>Confirm Delete Category</h1>
    <p>Are you sure you want to delete the category "{{ category.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'shop:products:admin_categories' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
